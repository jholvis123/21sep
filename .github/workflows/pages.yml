name: Publish static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "publish-21sep"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages source
        run: |
          rm -rf /tmp/site
          mkdir -p /tmp/site/docs
          cp index.html styles.css app.js /tmp/site/docs/
          touch /tmp/site/docs/.nojekyll

      - name: Publish gh-pages/docs
        run: |
          cd /tmp/site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "deploy: publish 21sep experience to docs"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
